<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="240" height="240" role="img" aria-label="Lock to unlock motion preview">
  <style>
    .body,.shackle{fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .shackle{transform-box:view-box;transform-origin:16px 10px;animation:unlock 2.4s cubic-bezier(.2,0,0,1) infinite}
    @keyframes unlock{0%,18%{transform:rotate(0deg) translateX(0)}42%,62%{transform:rotate(32deg) translateX(1.5px)}86%,100%{transform:rotate(0deg) translateX(0)}}
    @media (prefers-reduced-motion:reduce){.shackle{animation:none}}
  </style>
  <g class="body"><rect x="5" y="10" width="14" height="10" rx="2"/></g>
  <path class="shackle" d="M8 10V7a4 4 0 0 1 8 0v3"/>
</svg>
